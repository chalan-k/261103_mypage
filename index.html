              <form
                class="guest-form reveal"
                name="guestbook"
                method="POST"
                data-netlify="true"
                netlify-honeypot="bot-field"
                data-guestbook
              >
                <input type="hidden" name="form-name" value="guestbook" />
                <p class="guest-form__trap" aria-hidden="true">
                  <label>이 칸은 비워 두세요 <input name="bot-field" tabindex="-1" autocomplete="off" /></label>
                </p>

                <h3 class="guest-form__head">
                  <svg class="guest-form__icon" aria-hidden="true"><use href="#i-heart" /></svg>
                  <span data-text="guestbook.title"></span>
                </h3>

                  <span class="guest__icon guest-form__avatar" aria-hidden="true"><svg><use href="#i-minimi" /></svg></span>

                  <div class="guest-form__fields">
                    <p class="field">
                      <label for="guest-name" data-text="guestbook.nameLabel"></label>
                      <input id="guest-name" name="name" type="text" maxlength="30" autocomplete="off" data-placeholder="guestbook.namePlaceholder" />
                    </p>
                    <p class="field">
                      <label for="guest-message" data-text="guestbook.messageLabel"></label>
                      <textarea id="guest-message" name="message" rows="4" maxlength="500" required data-placeholder="guestbook.messagePlaceholder"></textarea>

                    <p class="guest-form__note" data-text="guestbook.note"></p>
                    <div class="guest-form__actions">
                      <button class="btn btn--accent" type="submit" data-text="guestbook.submit"></button>
                      <p class="guest-form__status" role="status" data-guestbook-status></p>
                    </div>
                  </div>
                </div>
              </form>

      <li class="badge" data-slot="label"></li>
    </template>

    <template id="tpl-diary">
      <li class="diary__entry">
        <span class="diary__number" data-slot="number" aria-hidden="true"></span>
        <p class="diary__text" data-slot="text"></p>
      </li>
    </template>

    <template id="tpl-research">
      <article class="folder reveal">
        <div class="folder__tab">
          <svg class="folder__icon" aria-hidden="true"><use data-slot="icon" /></svg>
          <span data-slot="tab"></span>
        </div>
        <div class="folder__body">
          <h3 class="folder__title" data-slot="title"></h3>
          <p class="folder__text" data-slot="description"></p>
          <p class="meta">
            <span class="meta__label" data-slot="recordLabel"></span>
            <span data-slot="record"></span>
          </p>
        </div>
      </article>
    </template>

    <template id="tpl-project">
      <article class="project reveal" data-slot="root">
        <span class="project__decor" aria-hidden="true"></span>
        <svg class="project__pixel" aria-hidden="true"><use href="#i-floppy" /></svg>
        <div class="project__top">
          <span class="project__number" data-slot="number"></span>
          <span class="project__status"><i class="dot" aria-hidden="true"></i><span data-slot="status"></span></span>
        </div>
        <h3 class="project__title" data-slot="title"></h3>
        <p class="project__text" data-slot="description"></p>
        <p class="meta">
          <span class="meta__label" data-slot="linkLabel"></span>
          <span data-slot="link"></span>
        </p>
      </article>
    </template>

    <template id="tpl-guest">
      <div class="guest reveal">
        <dt class="guest__head">
          <span class="guest__no" data-slot="number" aria-hidden="true"></span>
          <span data-slot="label"></span>
        </dt>
        <dd class="guest__body">
          <span class="guest__icon" aria-hidden="true"><svg><use data-slot="icon" /></svg></span>
          <span class="guest__value" data-slot="value"></span>
        </dd>
      </div>
    </template>

    <script type="module" src="/src/main.js"></script>
